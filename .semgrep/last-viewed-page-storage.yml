# LP-005 semgrep rules — "Remember last viewed page" storage hygiene
# Path-scoped to apps/web. Enforces the binding contract in
# docs/security/last-viewed-page-threat-model.md §8.
rules:
  - id: no-raw-lastpage-localstorage-write
    message: >-
      All writes to ta.nav.lastPage* MUST go through apps/web/src/nav/setLastPage.ts.
      Raw localStorage.setItem on this key is forbidden (LP-005 §8.1).
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/**
      exclude:
        - apps/web/src/navigation/setLastPage.ts
        - apps/web/src/navigation/lastPageStorage.ts
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/__tests__/**"
    pattern-either:
      - pattern: localStorage.setItem("ta.nav.lastPage.v1", ...)
      - pattern: localStorage.setItem('ta.nav.lastPage.v1', ...)
      - pattern: window.localStorage.setItem("ta.nav.lastPage.v1", ...)
      - pattern: window.localStorage.setItem('ta.nav.lastPage.v1', ...)

  - id: no-dynamic-lastpage-key
    message: >-
      Storage key must be the literal 'ta.nav.lastPage.v1'. No template strings,
      no concatenation, no variable indirection (LP-005 §8.2).
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/src/navigation/**
    pattern-either:
      - pattern: localStorage.setItem(`ta.nav.lastPage$...`, ...)
      - pattern: localStorage.getItem(`ta.nav.lastPage$...`)
      - pattern: localStorage.removeItem(`ta.nav.lastPage$...`)
      - pattern: localStorage.setItem("ta.nav.lastPage." + $X, ...)
      - pattern: localStorage.setItem('ta.nav.lastPage.' + $X, ...)

  - id: no-lastpage-search-in-telemetry
    message: >-
      Telemetry payloads MUST NOT include lastPage.search — search params on
      travel-assistant carry PII (origin/dest/dates/pax) and potentially tokens
      (LP-005 §2 Information disclosure, §8.7). Use pathname only.
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/**
    pattern-either:
      - pattern: track($EVENT, { ..., search: $LP.search, ... })
      - pattern: logEvent($EVENT, { ..., search: $LP.search, ... })
      - pattern: telemetry.$M($EVENT, { ..., search: $LP.search, ... })
      - pattern: analytics.$M($EVENT, { ..., search: $LP.search, ... })
      - pattern: track($EVENT, { ..., lastPage: $LP, ... })
      - pattern: logEvent($EVENT, { ..., lastPage: $LP, ... })

  - id: lastpage-restore-must-validate-path
    message: >-
      router.replace / router.push with a value sourced from getLastPage() MUST
      be wrapped by isSafeRelativePath() and the auth-gate check (LP-005 §3.1, §4).
      Pass the validated string explicitly — never the raw object.
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/**
      exclude:
        - "**/*.test.*"
        - "**/__tests__/**"
    pattern-either:
      - pattern: router.replace(getLastPage())
      - pattern: router.push(getLastPage())
      - pattern: router.replace(getLastPage().pathname)
      - pattern: router.push(getLastPage().pathname)
      - pattern: |
          $LP = getLastPage();
          ...
          router.replace($LP.pathname)
      - pattern: |
          $LP = getLastPage();
          ...
          router.push($LP.pathname)

  - id: no-lastpage-write-on-deny-list-route
    message: >-
      setLastPage() must not be called from auth/checkout-confirm/oauth-callback
      route files. These are transient pages — recording them as the "last page"
      either confuses (login form when signed in) or is dangerous (OAuth callback
      replay). LP-005 §5 deny-list.
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - "**/login/**"
        - "**/signin/**"
        - "**/signup/**"
        - "**/register/**"
        - "**/auth/callback/**"
        - "**/oauth/**"
        - "**/verify-email/**"
        - "**/reset-password/**"
        - "**/checkout/confirm/**"
        - "**/payments/result/**"
        - "**/logout/**"
    pattern-either:
      - pattern: setLastPage(...)
      - pattern: lastPageStorage.set(...)

  # ─── LP-001 alignment (XD shipped denylist as code @ squad-with-aspire 2180d3f) ───

  - id: lastpage-must-import-canonical-denylist
    message: >-
      The deny-list is the single source of truth at
      apps/web/src/navigation/lastPage.denylist.ts (exports PATHNAME_DENY_PATTERNS,
      SEARCH_DENY_PATTERNS, isDenied, isSafeRelativePath). Inline regex arrays or
      duplicated literal lists fragment enforcement (LP-005 §3.2 + LP-001 D2).
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/src/navigation/**
      exclude:
        - apps/web/src/navigation/lastPage.denylist.ts
        - apps/web/src/navigation/denyList.ts
        - "**/*.test.*"
        - "**/__tests__/**"
    pattern-either:
      - pattern: const PATHNAME_DENY_PATTERNS = [...]
      - pattern: const SEARCH_DENY_PATTERNS = [...]
      - pattern: const lastPageDeny = [...]
      - pattern: const LASTPAGE_DENY = [...]

  - id: lastpage-restore-must-call-issaferelativepath
    message: >-
      Any router.replace/router.push driven by a value originating from
      getLastPage() / localStorage.getItem('ta.nav.lastPage.v1') MUST be gated by
      isSafeRelativePath() AND isDenied() from
      apps/web/src/navigation/lastPage.denylist.ts. Reader re-validates — storage
      is untrusted input (LP-005 §3.1, §8.3).
    severity: ERROR
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/**
      exclude:
        - "**/*.test.*"
        - "**/__tests__/**"
    pattern-either:
      - pattern: |
          $X = localStorage.getItem("ta.nav.lastPage.v1");
          ...
          router.$M($X)
      - pattern: |
          $X = localStorage.getItem('ta.nav.lastPage.v1');
          ...
          router.$M($X)

  - id: no-lastpage-restoring-breadcrumb-misuse
    message: >-
      The sessionStorage breadcrumb 'ta.nav.lastPage.restoring' is RESERVED for
      not-found.tsx → restore-failure detection (LP-001 spec §3, blessed by
      LP-005 addendum A1). It MUST be transient: set immediately before
      router.replace, cleared on destination mount or after one tick. Do not
      stash routes, params, or PII in it.
    severity: WARNING
    languages: [ts, tsx, js, jsx]
    paths:
      include:
        - apps/web/**
      exclude:
        - apps/web/src/navigation/**
        - "**/not-found.tsx"
        - "**/*.test.*"
        - "**/__tests__/**"
    pattern-either:
      - pattern: sessionStorage.setItem("ta.nav.lastPage.restoring", ...)
      - pattern: sessionStorage.setItem('ta.nav.lastPage.restoring', ...)
      - pattern: window.sessionStorage.setItem("ta.nav.lastPage.restoring", ...)
      - pattern: window.sessionStorage.setItem('ta.nav.lastPage.restoring', ...)
